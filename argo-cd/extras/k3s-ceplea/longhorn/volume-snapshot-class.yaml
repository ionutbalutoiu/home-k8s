apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: driver.longhorn.io
parameters:
  # Local Longhorn snapshot; does not require an S3 backup target.
  # Offsite copies are handled separately (e.g. home-backup restic -> OneDrive).
  type: snap
deletionPolicy: Delete
