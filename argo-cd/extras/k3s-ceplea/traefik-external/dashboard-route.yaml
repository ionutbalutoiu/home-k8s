---
# The external Traefik dashboard, served through traefik-internal so it sits
# under the internal wildcard like every other internal endpoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-external-dashboard
spec:
  hostnames:
    - traefik-external.internal.balutoiu.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik-internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # group, kind and weight are the API defaults, spelled out so the
        # server-side diff matches.
        - group: ""
          kind: Service
          name: traefik-external-dashboard
          port: 8080
          weight: 1
