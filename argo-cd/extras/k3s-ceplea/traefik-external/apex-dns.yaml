---
# The ceplea origin. Every public host is a CNAME to this name, and the
# router's DDNS keeps balutoiu-ceplea.go.ro on the WAN IP.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: balutoiu-com
spec:
  endpoints:
    - dnsName: balutoiu.com
      recordType: CNAME
      targets:
        - balutoiu-ceplea.go.ro
