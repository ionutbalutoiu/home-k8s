global:
  alwaysAppendIdentifierToResourceName: true

defaultPodOptions:
  terminationGracePeriodSeconds: 5
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - hyper-ryzen

controllers:
  frigate:
    strategy: Recreate
    initContainers:
      init-config:
        image:
          repository: busybox
          pullPolicy: IfNotPresent
          tag: 1.38.0
        command:
          - cp
        args:
          - /config.yml
          - /config/config.yml
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            memory: 32Mi
    containers:
      frigate:
        image: &frigate_image
          repository: ghcr.io/blakeblackshear/frigate
          pullPolicy: IfNotPresent
          tag: 0.17.2
        envFrom:
          - secretRef:
              name: frigate-secrets
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 3000m
            memory: 10Gi
          limits:
            memory: 10Gi

  # NOTE: A second, compositor-only Frigate. It pulls the Tapo sub-streams
  # (stream2) of the Camere_Tati cameras and only produces a Birdseye restream
  # for the eye-pi kiosk (10.119.1.105), played with mpv over RTSP. No
  # recording, no motion, no detection.
  birdseye-pi-eye:
    strategy: Recreate
    initContainers:
      init-config:
        image:
          repository: busybox
          pullPolicy: IfNotPresent
          tag: 1.38.0
        command:
          - cp
        args:
          - /config.yml
          - /config/config.yml
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            memory: 32Mi
    containers:
      frigate:
        image: *frigate_image
        envFrom:
          - secretRef:
              name: frigate-secrets
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 3Gi

  wg-proxy:
    strategy: Recreate
    containers:
      main:
        image: &wg_image
          repository: lscr.io/linuxserver/wireguard
          pullPolicy: IfNotPresent
          tag: 1.0.20260223
        env:
          TZ: Europe/Bucharest
          PUID: 0
          PGID: 0
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        probes:
          readiness: &healthcheck_probe_spec
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              exec:
                command:
                  - /bin/ping
                  - -c
                  - "1"
                  - "192.168.99.1"
          liveness: *healthcheck_probe_spec
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
    initContainers:
      setup-dnat:
        image: *wg_image
        command:
          - /bin/sh
        args:
          - /wg-proxy-dnat/setup.sh
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 1m
            memory: 64Mi
          limits:
            memory: 64Mi

service:
  frigate:
    controller: frigate
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.119.20.10
    ports:
      http:
        port: 5000
  birdseye-pi-eye:
    controller: birdseye-pi-eye
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 10.119.20.12
    ports:
      # NOTE: The web UI is only for debugging. Its Birdseye page renders
      # stretched in browsers because the AMD VAAPI encoder gives go2rtc no
      # SPS/PPS headers. The kiosk plays the RTSP stream instead.
      http:
        port: 5000
      # go2rtc RTSP: rtsp://10.119.20.12:8554/birdseye
      rtsp:
        port: 8554
  wg-proxy:
    controller: wg-proxy
    type: ClusterIP
    ports:
      camera1:
        protocol: TCP
        port: 5541
      camera2:
        protocol: TCP
        port: 5542
      camera3:
        protocol: TCP
        port: 5543
      camera4:
        protocol: TCP
        port: 5544

route:
  frigate:
    parentRefs:
      - name: traefik-gateway
        namespace: traefik-external
    hostnames:
      - frigate.balutoiu.com
    rules:
      - name: frigate
        matches:
          - path:
              type: PathPrefix
              value: /
        filters:
          # Rate limit first, so floods never reach Authelia.
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: rate-limit
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: forwardauth-authelia
        backendRefs:
          - identifier: frigate
            port: http

configMaps:
  config:
    data:
      config.yml: |
        version: 0.17-0

        mqtt:
          enabled: false

        detectors:
          cpu:
            type: cpu

        logger:
          default: info

        detect:
          enabled: false
          # NOTE: The settings below apply for the live cameras feed. Birdseye
          # output is capped at 10 fps by Frigate, so decoding faster than that
          # only burns CPU.
          width: 1280
          height: 720
          fps: 10

        # NOTE: Recording is continuous and object detection is off, so motion
        # detection would only cost CPU on every decoded frame.
        motion:
          enabled: false

        ffmpeg:
          hwaccel_args: preset-vaapi
          output_args:
            record: preset-record-generic-audio-aac

        birdseye:
          enabled: true
          width: 1920
          height: 1080
          quality: 8
          mode: continuous
          # NOTE: Keep restream off. With the AMD VAAPI encoder, ffmpeg gets no
          # SPS/PPS extradata, go2rtc then advertises a 128x96 track, and MSE
          # players (the kiosk browsers) render Birdseye stretched to 4:3.

        record:
          enabled: true
          continuous:
            days: 14
          motion:
            days: 14

        # NOTE: The UI ignores the order of the camera_groups lists and sorts
        # every group by ui.order instead, so each camera gets an explicit one.
        cameras:
          1ceplea_poarta:
            ui:
              order: 10
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_POARTA_USER}:{FRIGATE_CEPLEA_POARTA_PASSWORD}@10.101.101.173:554//stream1
                  roles:
                    - record
          2ceplea_poarta_tataie:
            ui:
              order: 20
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_POARTA_TATAIE_USER}:{FRIGATE_CEPLEA_POARTA_TATAIE_PASSWORD}@10.101.101.136:554//stream1
                  roles:
                    - record
          3ceplea_tataie_gaini:
            ui:
              order: 30
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_TATAIE_GAINI_USER}:{FRIGATE_CEPLEA_TATAIE_GAINI_PASSWORD}@10.101.101.41:554//stream1
                  roles:
                    - record
          4ceplea_curte_fata:
            ui:
              order: 40
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_CURTE_FATA_USER}:{FRIGATE_CEPLEA_CURTE_FATA_PASSWORD}@10.101.101.253:554//stream1
                  roles:
                    - record
          5ceplea_curte_spate:
            ui:
              order: 50
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_CURTE_SPATE_USER}:{FRIGATE_CEPLEA_CURTE_SPATE_PASSWORD}@10.102.102.81:554//stream1
                  roles:
                    - record
          6ceplea_gradina:
            ui:
              order: 60
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_GRADINA_USER}:{FRIGATE_CEPLEA_GRADINA_PASSWORD}@10.101.101.102:554//stream1
                  roles:
                    - record
          7floresti_poarta:
            ui:
              order: 70
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_FLORESTI_POARTA_USER}:{FRIGATE_FLORESTI_POARTA_PASSWORD}@frigate-wg-proxy.frigate.svc.cluster.local:5541//stream1
                  roles:
                    - record
          8floresti_curte_fata:
            ui:
              order: 80
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_FLORESTI_CURTE_FATA_USER}:{FRIGATE_FLORESTI_CURTE_FATA_PASSWORD}@frigate-wg-proxy.frigate.svc.cluster.local:5542//stream1
                  roles:
                    - record
          9floresti_gaini:
            ui:
              order: 90
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_FLORESTI_GAINI_USER}:{FRIGATE_FLORESTI_GAINI_PASSWORD}@frigate-wg-proxy.frigate.svc.cluster.local:5543//stream1
                  roles:
                    - record
          # NOTE: Kept out of Birdseye, so it stays a 3x3 grid of the first 9 cameras.
          10ceplea_casuta_tataie:
            ui:
              order: 65
            birdseye:
              enabled: false
            detect:
              enabled: false
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_CASUTA_TATAIE_USER}:{FRIGATE_CEPLEA_CASUTA_TATAIE_PASSWORD}@10.101.101.25:554/stream1
                  roles:
                    - record
            friendly_name: 10ceplea casuta tataie

        camera_groups:
          Birdseye:
            order: 1
            icon: LuWatch
            cameras: birdseye
          Ceplea:
            order: 2
            icon: LuWarehouse
            cameras:
              - 1ceplea_poarta
              - 2ceplea_poarta_tataie
              - 3ceplea_tataie_gaini
              - 4ceplea_curte_fata
              - 5ceplea_curte_spate
              - 6ceplea_gradina
          Floresti:
            order: 3
            icon: LuWarehouse
            cameras:
              - 7floresti_poarta
              - 8floresti_curte_fata
              - 9floresti_gaini
          # NOTE: Same layout as the Birdseye grid, with 6ceplea_gradina swapped
          # out for 10ceplea_casuta_tataie.
          Camere_Tati:
            order: 4
            icon: LuMonitor
            cameras:
              - 1ceplea_poarta
              - 2ceplea_poarta_tataie
              - 3ceplea_tataie_gaini
              - 4ceplea_curte_fata
              - 5ceplea_curte_spate
              - 10ceplea_casuta_tataie
              - 7floresti_poarta
              - 8floresti_curte_fata
              - 9floresti_gaini

  birdseye-pi-eye-config:
    data:
      config.yml: |
        version: 0.17-0

        mqtt:
          enabled: false

        detectors:
          cpu:
            type: cpu

        logger:
          default: info

        # NOTE: Tapo stream2 is 640x360, which drops straight into the 3x3
        # Birdseye tiles of a 1920x1080 canvas without resizing. Birdseye output
        # is capped at 10 fps by Frigate.
        detect:
          enabled: false
          width: 640
          height: 360
          fps: 10

        motion:
          enabled: false

        record:
          enabled: false

        snapshots:
          enabled: false

        ffmpeg:
          hwaccel_args: preset-vaapi

        birdseye:
          enabled: true
          width: 1920
          height: 1080
          mode: continuous
          # Published by go2rtc as rtsp://<service ip>:8554/birdseye (H.264,
          # VAAPI encoded). Play it with a native RTSP client (mpv), not a
          # browser: see the service note.
          restream: true

        # NOTE: Same layout as the Camere_Tati group of the main Frigate, with
        # 10ceplea_casuta_tataie in place of 6ceplea_gradina. Birdseye tiles are
        # ordered by birdseye.order.
        cameras:
          1ceplea_poarta:
            birdseye:
              order: 1
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_POARTA_USER}:{FRIGATE_CEPLEA_POARTA_PASSWORD}@10.101.101.173:554/stream2
                  roles:
                    - detect
          2ceplea_poarta_tataie:
            birdseye:
              order: 2
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_POARTA_TATAIE_USER}:{FRIGATE_CEPLEA_POARTA_TATAIE_PASSWORD}@10.101.101.136:554/stream2
                  roles:
                    - detect
          3ceplea_tataie_gaini:
            birdseye:
              order: 3
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_TATAIE_GAINI_USER}:{FRIGATE_CEPLEA_TATAIE_GAINI_PASSWORD}@10.101.101.41:554/stream2
                  roles:
                    - detect
          4ceplea_curte_fata:
            birdseye:
              order: 4
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_CURTE_FATA_USER}:{FRIGATE_CEPLEA_CURTE_FATA_PASSWORD}@10.101.101.253:554/stream2
                  roles:
                    - detect
          5ceplea_curte_spate:
            birdseye:
              order: 5
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_CURTE_SPATE_USER}:{FRIGATE_CEPLEA_CURTE_SPATE_PASSWORD}@10.102.102.81:554/stream2
                  roles:
                    - detect
          10ceplea_casuta_tataie:
            birdseye:
              order: 6
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_CEPLEA_CASUTA_TATAIE_USER}:{FRIGATE_CEPLEA_CASUTA_TATAIE_PASSWORD}@10.101.101.25:554/stream2
                  roles:
                    - detect
          7floresti_poarta:
            birdseye:
              order: 7
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_FLORESTI_POARTA_USER}:{FRIGATE_FLORESTI_POARTA_PASSWORD}@frigate-wg-proxy.frigate.svc.cluster.local:5541/stream2
                  roles:
                    - detect
          8floresti_curte_fata:
            birdseye:
              order: 8
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_FLORESTI_CURTE_FATA_USER}:{FRIGATE_FLORESTI_CURTE_FATA_PASSWORD}@frigate-wg-proxy.frigate.svc.cluster.local:5542/stream2
                  roles:
                    - detect
          9floresti_gaini:
            birdseye:
              order: 9
            ffmpeg:
              inputs:
                - path: rtsp://{FRIGATE_FLORESTI_GAINI_USER}:{FRIGATE_FLORESTI_GAINI_PASSWORD}@frigate-wg-proxy.frigate.svc.cluster.local:5543/stream2
                  roles:
                    - detect

  wg-proxy-dnat:
    data:
      setup.sh: |
        #!/bin/sh
        set -e

        apk add -q --no-cache iptables yq

        echo "Setting up DNAT iptables rules..."
        DEFAULT_IFACE=$(ip route show default | awk '/default/ {print $5}')
        for PORT_FORWARD in $(cat /wg-proxy-dnat/config.yaml | yq '.[] | "\(.remote_ip)|\(.remote_port)|\(.local_port)|\(.protocol)"'); do
            REMOTE_IP=$(echo $PORT_FORWARD | cut -d '|' -f 1)
            REMOTE_PORT=$(echo $PORT_FORWARD | cut -d '|' -f 2)
            LOCAL_PORT=$(echo $PORT_FORWARD | cut -d '|' -f 3)
            PROTOCOL=$(echo $PORT_FORWARD | cut -d '|' -f 4)

            echo "Port forwarding from remote $REMOTE_IP:$REMOTE_PORT to local 0.0.0.0:$LOCAL_PORT using protocol $PROTOCOL"
            iptables -t nat -A PREROUTING -i $DEFAULT_IFACE -p $PROTOCOL --dport $LOCAL_PORT -j DNAT --to-destination ${REMOTE_IP}:${REMOTE_PORT}
            iptables -t nat -A POSTROUTING -p $PROTOCOL -d $REMOTE_IP --dport $REMOTE_PORT -j MASQUERADE
        done

      config.yaml: |
        - remote_ip: 192.168.99.2
          remote_port: 5541
          local_port: 5541
          protocol: tcp

        - remote_ip: 192.168.99.2
          remote_port: 5542
          local_port: 5542
          protocol: tcp

        - remote_ip: 192.168.99.2
          remote_port: 5543
          local_port: 5543
          protocol: tcp

        - remote_ip: 192.168.99.2
          remote_port: 5544
          local_port: 5544
          protocol: tcp

persistence:
  dshm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      frigate:
        frigate:
          - path: /dev/shm

  tmp-cache:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      frigate:
        frigate:
          - path: /tmp/cache

  media:
    type: hostPath
    hostPath: /storage/frigate/media
    advancedMounts:
      frigate:
        frigate:
          - path: /media/frigate

  config:
    type: configMap
    identifier: config
    advancedMounts:
      frigate:
        init-config:
          - path: /config.yml
            readOnly: true
            subPath: config.yml

  database:
    type: hostPath
    hostPath: /storage/ssd-nvme-raid0/pvc-shared/frigate
    advancedMounts:
      frigate:
        init-config:
          - path: /config
        frigate:
          - path: /config

  # NOTE: Nothing in the birdseye-pi-eye Frigate is worth persisting: no
  # recordings, and the sqlite DB only holds state we do not use.
  birdseye-pi-eye-dshm:
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    advancedMounts:
      birdseye-pi-eye:
        frigate:
          - path: /dev/shm

  birdseye-pi-eye-tmp-cache:
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    advancedMounts:
      birdseye-pi-eye:
        frigate:
          - path: /tmp/cache

  birdseye-pi-eye-media:
    type: emptyDir
    sizeLimit: 1Gi
    advancedMounts:
      birdseye-pi-eye:
        frigate:
          - path: /media/frigate

  birdseye-pi-eye-config:
    type: configMap
    identifier: birdseye-pi-eye-config
    advancedMounts:
      birdseye-pi-eye:
        init-config:
          - path: /config.yml
            readOnly: true
            subPath: config.yml

  birdseye-pi-eye-data:
    type: emptyDir
    sizeLimit: 1Gi
    advancedMounts:
      birdseye-pi-eye:
        init-config:
          - path: /config
        frigate:
          - path: /config

  wg-proxy-peer-conf:
    type: secret
    name: wg-proxy-peer-conf
    defaultMode: 0600
    advancedMounts:
      wg-proxy:
        main:
          - path: /config/wg_confs/wg0.conf
            subPath: peer_CepleaFrigate.conf
            readOnly: true

  wg-proxy-dnat:
    type: configMap
    identifier: wg-proxy-dnat
    advancedMounts:
      wg-proxy:
        setup-dnat:
          - path: /wg-proxy-dnat
