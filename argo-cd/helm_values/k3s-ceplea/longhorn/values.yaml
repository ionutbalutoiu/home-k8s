preUpgradeChecker:
  jobEnabled: false

defaultSettings:
  fastReplicaRebuildEnabled: true
  snapshotDataIntegrity: enabled
  snapshotDataIntegrityImmediateCheckAfterSnapshotCreation: true
  snapshotDataIntegrityCronjob: "0 3 * * *"

persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort
  reclaimPolicy: Delete

httproute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-internal
  hostnames:
    - longhorn.internal.balutoiu.com

metrics:
  serviceMonitor:
    enabled: true

# Disabled: S3 backups to the k3s-buc garage-archive target.
# Uncomment to re-enable (needs the matching 1Password creds for the new target).
# defaultBackupStore:
#   backupTarget: s3://longhorn-backups@garage/
#   backupTargetCredentialSecret: longhorn-backups-s3-creds
