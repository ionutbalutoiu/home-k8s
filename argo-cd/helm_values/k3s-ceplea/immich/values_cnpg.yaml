fullnameOverride: immich-postgres

version:
  postgresql: "16"

cluster:
  instances: 2
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3@sha256:bdb8d8829bd68c9204628cde5c495db9db0d2b45e958ddd17de1703338a3b98b
  resources:
    requests:
      cpu: 25m
      memory: 1Gi
    limits:
      memory: 1Gi
  storage:
    size: 4Gi
    storageClass: openebs-lvm-pv-thin
  enableSuperuserAccess: false
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    shared_preload_libraries:
      - vchord.so
  initdb:
    database: immich
    owner: immich
  roles:
    - name: immich
      superuser: true
      login: true

databases:
  - name: immich
    owner: immich
    extensions:
      - name: vector
      - name: vchord
        version: 0.4.3
      - name: earthdistance
