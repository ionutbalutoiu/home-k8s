fullnameOverride: immich-postgres

version:
  postgresql: "16"

imageCatalog:
  create: true
  images:
    # https://github.com/tensorchord/cloudnative-vectorchord
    - major: 16
      image: ghcr.io/tensorchord/cloudnative-vectorchord:16.14-1.1.1@sha256:4a26ca6aad2482289f4a3d3317ccbf1439ce3de140994598375a1f4c4e2e9f8d

cluster:
  instances: 1
  imageCatalogRef:
    kind: ImageCatalog
    name: immich-postgres
    major: 16
  resources:
    requests:
      cpu: 25m
      memory: 2Gi
    limits:
      memory: 2Gi
  storage:
    size: 5Gi
    storageClass: openebs-lvm-pv-thin
  enableSuperuserAccess: false
  # A single instance cannot switch over, so a PDB would only block node drains.
  enablePDB: false
  postgresql:
    shared_preload_libraries:
      - vchord.so
  initdb:
    database: immich
    owner: immich
  roles:
    - name: immich
      superuser: true
      login: true

databases:
  - name: immich
    owner: immich
    extensions:
      - name: vector
      # Must track the vchord shipped in the image above.
      - name: vchord
        version: 1.1.1
      - name: earthdistance
