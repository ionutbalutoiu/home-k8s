garage:
  dbEngine: "sqlite"
  replicationFactor: "1"
  metadataAutoSnapshotInterval: "6h"
  additionalTopLevelConfig: |-
    metadata_snapshots_dir = "/mnt/data/meta-snapshots"
  existingRpcSecret: garage-rpc-secret
  s3:
    api:
      region: "garage"
      rootDomain: "-s3.internal.balutoiu.com"
    web:
      rootDomain: ".balutoiu.com"
      index: "index.html"

persistence:
  enabled: true
  meta:
    storageClass: longhorn-2r-xfs
    size: 2Gi
  data:
    storageClass: longhorn-2r-xfs
    size: 15Gi

deployment:
  kind: StatefulSet
  replicaCount: 1

readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

resources:
  requests:
    cpu: 20m
    memory: 512Mi
  limits:
    memory: 512Mi
